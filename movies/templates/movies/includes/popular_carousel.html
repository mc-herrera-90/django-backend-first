<section class="popular-carousel">
  <div id="popularMovies"
       class="carousel slide carousel-fade"
       data-bs-ride="carousel"
       data-bs-interval="6000">
    <div class="carousel-indicators">
      {% for movie in popular_movies %}
        <button type="button"
                data-bs-target="#popularMovies"
                data-bs-slide-to="{{ forloop.counter0 }}"
                class="{% if forloop.first %}active{% endif %}"
                {% if forloop.first %}aria-current="true"{% endif %}
                aria-label="{{ movie.title }}"></button>
      {% endfor %}
    </div>
    <div class="carousel-inner">
      {% for movie in popular_movies %}
        <div class="carousel-item {% if forloop.first %}active{% endif %}">
          {% if movie.landscape %}
            <img src="{{ movie.landscape.url }}"
                 class="popular-backdrop"
                 alt="{{ movie.title }}">
          {% endif %}
          <div class="popular-overlay"></div>
          <div class="popular-content">
            <div class="container">
              <div class="popular-info">
                <span class="popular-label">MÁS DESTACADA</span>
                <h1>{{ movie.title }}</h1>
                <div class="popular-meta">
                  <span>{{ movie.year }}</span>
                  <span>{{ movie.genre }}</span>
                  <span>{{ movie.duration }} min</span>
                </div>
                <p>{{ movie.description }}</p>
                <a href="{% url 'movies:detail' movie.id %}" class="btn btn-light px-4">Ver detalles</a>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#popularMovies"
            data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#popularMovies"
            data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</section>
